<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="280" viewBox="0 0 1040 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ZJY-HSBL — Visual intelligence. Practical engineering.</title>
  <desc id="desc">A dark violet research notebook with an animated network of connected points. Software engineering, visual intelligence, and efficient AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1040" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121019"/>
      <stop offset="1" stop-color="#251840"/>
    </linearGradient>
    <linearGradient id="trail" x1="704" y1="224" x2="1000" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C4B5FD" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="1038" height="278" rx="20"/></clipPath>
  </defs>
  <style>
    .trail { stroke-dasharray: 12 8; animation: flow 14s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 5s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -100; } }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .7; transform: scale(1.3); } }
    @media (prefers-reduced-motion: reduce) { .trail, .pulse { animation: none; } }
  </style>
  <g clip-path="url(#bounds)">
    <rect width="1040" height="280" fill="url(#background)"/>
    <path d="M680 0H1040V280H680Z" fill="url(#grid)"/>
    <circle cx="915" cy="140" r="108" stroke="#A78BFA" stroke-opacity="0.12"/>
    <circle cx="915" cy="140" r="78" stroke="#A78BFA" stroke-opacity="0.12"/>
    <path d="M710 218L771 166L821 188L872 101L925 131L996 63M771 166L760 88L872 101M821 188L927 222L925 131L1000 186" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="1.5"/>
    <path class="trail" d="M710 218L771 166L821 188L872 101L925 131L996 63" stroke="url(#trail)" stroke-width="2.5"/>
    <g fill="#C4B5FD">
      <circle cx="710" cy="218" r="4"/><circle cx="771" cy="166" r="5"/>
      <circle cx="821" cy="188" r="4"/><circle cx="872" cy="101" r="6"/>
      <circle cx="925" cy="131" r="5"/><circle cx="996" cy="63" r="4"/>
      <circle cx="760" cy="88" r="3" opacity=".4"/><circle cx="927" cy="222" r="3" opacity=".4"/>
      <circle cx="1000" cy="186" r="3" opacity=".4"/>
    </g>
    <circle class="pulse" cx="872" cy="101" r="15" stroke="#A78BFA"/>
    <path d="M48 57H73" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <text x="86" y="62" font-size="14" font-weight="600" letter-spacing="2.8" fill="#C4B5FD">RESEARCH / ENGINEERING</text>
      <text x="46" y="145" font-size="70" font-weight="750" letter-spacing="-3" fill="#F5F3FF">ZJY-HSBL<tspan fill="#A78BFA">.</tspan></text>
      <text x="48" y="190" font-size="24" fill="#C4B5D8">Visual intelligence. Practical engineering.</text>
      <text x="48" y="240" font-size="14" letter-spacing="1.4" fill="#C4B5FD">COMPUTER VISION</text>
      <circle cx="221" cy="235" r="2" fill="#7C3AED"/>
      <text x="237" y="240" font-size="14" letter-spacing="1.4" fill="#C4B5FD">EFFICIENT AI</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1039" height="279" rx="20.5" stroke="#3B2B56"/>
</svg>
